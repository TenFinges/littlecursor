<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="360" rx="20" fill="#0f0e16"/>
  <defs>
    <g id="k"><rect width="46" height="40" rx="8" fill="#2b2a36" stroke="#4d4b60"/></g>
    <g id="kw"><rect width="82" height="40" rx="8" fill="#2b2a36" stroke="#4d4b60"/></g>
  </defs>
  <g font-size="15" fill="#f4f2ff">
    <!-- row helper: keys at x=40, text at x=330 -->
    <g transform="translate(40,30)"><use href="#k"/><text x="23" y="26" text-anchor="middle">⌃</text><use href="#kw" x="54"/><text x="95" y="26" text-anchor="middle">space</text>
      <text x="290" y="18" font-weight="700">Hold to talk</text><text x="290" y="36" fill="#a8a6bf" font-size="13">Hold, ask about your screen, let go.</text></g>
    <g transform="translate(40,84)"><use href="#k"/><text x="23" y="26" text-anchor="middle">⌥</text><use href="#kw" x="54"/><text x="95" y="26" text-anchor="middle">space</text>
      <text x="290" y="18" font-weight="700">Conversation</text><text x="290" y="36" fill="#a8a6bf" font-size="13">Press once and keep talking. Press again to stop.</text></g>
    <g transform="translate(40,138)"><use href="#k"/><text x="23" y="26" text-anchor="middle">⌥</text><use href="#k" x="54"/><text x="77" y="26" text-anchor="middle">⇧</text><use href="#k" x="108"/><text x="131" y="26" text-anchor="middle">T</text>
      <text x="290" y="18" font-weight="700">Type a question</text><text x="290" y="36" fill="#a8a6bf" font-size="13">Opens a small box by your cursor.</text></g>
    <g transform="translate(40,192)"><use href="#k"/><text x="23" y="26" text-anchor="middle">⌃</text><use href="#k" x="54"/><text x="77" y="26" text-anchor="middle">⌥</text>
      <text x="290" y="18" font-weight="700">Talk and draw</text><text x="290" y="36" fill="#a8a6bf" font-size="13">Hold and move the mouse to circle things while you ask.</text></g>
    <g transform="translate(40,246)"><use href="#k"/><text x="23" y="26" text-anchor="middle" font-size="13">fn</text><use href="#k" x="54"/><text x="77" y="26" text-anchor="middle">⌃</text>
      <text x="290" y="18" font-weight="700">Dictate</text><text x="290" y="36" fill="#a8a6bf" font-size="13">Hold and talk to type into any app. Double-tap for hands-free.</text></g>
    <g transform="translate(40,300)"><use href="#kw"/><text x="41" y="26" text-anchor="middle" font-size="13">esc</text>
      <text x="290" y="18" font-weight="700">Stop · clear · close</text><text x="290" y="36" fill="#a8a6bf" font-size="13">Stops the answer. Again: clears drawings, then closes. Closed by mistake? Undo.</text></g>
  </g>
</svg>
