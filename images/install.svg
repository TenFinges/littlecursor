<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="260" rx="20" fill="#0f0e16"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fadff"/><stop offset="1" stop-color="#b78cff"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a8b3ff"/></marker>
  </defs>
  <!-- step 1: zip -->
  <g transform="translate(70,48)">
    <rect x="18" y="0" width="84" height="104" rx="10" fill="#2a2838" stroke="#4a4760"/>
    <rect x="52" y="8" width="16" height="10" fill="#6d6a86"/><rect x="52" y="22" width="16" height="10" fill="#6d6a86"/><rect x="52" y="36" width="16" height="10" fill="#6d6a86"/>
    <rect x="46" y="54" width="28" height="22" rx="4" fill="#8e8aa8"/>
    <text x="60" y="140" fill="#f4f2ff" font-size="15" font-weight="600" text-anchor="middle">LittleCursor-x.y.z.zip</text>
    <text x="60" y="164" fill="#a8a6bf" font-size="13" text-anchor="middle">1. Download &amp; double-click</text>
  </g>
  <line x1="215" y1="100" x2="300" y2="100" stroke="#a8b3ff" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <!-- step 2: app -->
  <g transform="translate(330,48)">
    <rect x="18" y="0" width="104" height="104" rx="24" fill="url(#g)"/>
    <path d="M52 22 L52 82 L66 68 L76 90 L86 86 L76 64 L95 64 Z" fill="#fff" stroke="#2a2050" stroke-width="3" stroke-linejoin="round"/>
    <text x="70" y="140" fill="#f4f2ff" font-size="15" font-weight="600" text-anchor="middle">LittleCursor.app</text>
    <text x="70" y="164" fill="#a8a6bf" font-size="13" text-anchor="middle">2. Drag it…</text>
  </g>
  <line x1="485" y1="100" x2="570" y2="100" stroke="#a8b3ff" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <!-- step 3: Applications folder -->
  <g transform="translate(595,48)">
    <path d="M10 18 a8 8 0 0 1 8-8 h34 l10 12 h66 a8 8 0 0 1 8 8 v66 a8 8 0 0 1-8 8 H18 a8 8 0 0 1-8-8z" fill="#3d8bfd"/>
    <path d="M10 34 h126 v62 a8 8 0 0 1-8 8 H18 a8 8 0 0 1-8-8z" fill="#5aa2ff"/>
    <text x="73" y="80" fill="#fff" font-size="30" font-weight="700" text-anchor="middle">A</text>
    <text x="73" y="140" fill="#f4f2ff" font-size="15" font-weight="600" text-anchor="middle">Applications</text>
    <text x="73" y="164" fill="#a8a6bf" font-size="13" text-anchor="middle">3. …into Applications</text>
  </g>
  <text x="410" y="238" fill="#ffbd94" font-size="13.5" text-anchor="middle">Open it from Applications, not from Downloads.</text>
</svg>
