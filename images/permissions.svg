<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="300" rx="20" fill="#0f0e16"/>
  <text x="40" y="48" fill="#f4f2ff" font-size="18" font-weight="700">Permissions it asks for</text>
  <text x="40" y="72" fill="#a8a6bf" font-size="13">The welcome tour asks for each one. Turn on what you'll use.</text>
  <g font-size="14.5">
    <rect x="40" y="90" width="740" height="44" rx="10" fill="#1c1b24"/>
    <text x="60" y="117" fill="#f4f2ff" font-weight="600">Screen Recording</text><text x="250" y="117" fill="#a8a6bf">see your screen when you ask (then click Relaunch)</text>
    <rect x="718" y="101" width="44" height="24" rx="12" fill="#34c759"/><circle cx="750" cy="113" r="10" fill="#fff"/>
    <rect x="40" y="142" width="740" height="44" rx="10" fill="#1c1b24"/>
    <text x="60" y="169" fill="#f4f2ff" font-weight="600">Microphone</text><text x="250" y="169" fill="#a8a6bf">voice questions and dictation</text>
    <rect x="718" y="153" width="44" height="24" rx="12" fill="#34c759"/><circle cx="750" cy="165" r="10" fill="#fff"/>
    <rect x="40" y="194" width="740" height="44" rx="10" fill="#1c1b24"/>
    <text x="60" y="221" fill="#f4f2ff" font-weight="600">Speech Recognition</text><text x="250" y="221" fill="#a8a6bf">turns your voice into text, on your Mac</text>
    <rect x="718" y="205" width="44" height="24" rx="12" fill="#34c759"/><circle cx="750" cy="217" r="10" fill="#fff"/>
    <rect x="40" y="246" width="740" height="44" rx="10" fill="#1c1b24"/>
    <text x="60" y="273" fill="#f4f2ff" font-weight="600">Accessibility</text><text x="250" y="273" fill="#a8a6bf">optional: types dictation and drafts into other apps</text>
    <rect x="718" y="257" width="44" height="24" rx="12" fill="#4a4858"/><circle cx="730" cy="269" r="10" fill="#fff"/>
  </g>
</svg>
