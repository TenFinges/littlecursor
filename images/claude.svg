<svg xmlns="http://www.w3.org/2000/svg" width="820" height="370" viewBox="0 0 820 370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="370" rx="20" fill="#0f0e16"/>
  <!-- terminal -->
  <rect x="40" y="30" width="740" height="170" rx="12" fill="#121116" stroke="#3a3946"/>
  <circle cx="62" cy="50" r="6" fill="#ff5f57"/><circle cx="82" cy="50" r="6" fill="#febc2e"/><circle cx="102" cy="50" r="6" fill="#28c840"/>
  <text x="410" y="55" fill="#8d8b9c" font-size="13" text-anchor="middle">Terminal</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <text x="64" y="94" fill="#8d8b9c"># 1. install Claude Code</text>
    <text x="64" y="118" fill="#f4f2ff"><tspan fill="#6ee7a8">$</tspan> curl -fsSL https://claude.ai/install.sh | bash</text>
    <text x="64" y="152" fill="#8d8b9c"># 2. sign in with your Claude account, then type /exit</text>
    <text x="64" y="176" fill="#f4f2ff"><tspan fill="#6ee7a8">$</tspan> claude</text>
  </g>
  <!-- settings card -->
  <rect x="40" y="220" width="740" height="110" rx="12" fill="#1c1b24"/>
  <text x="60" y="248" fill="#a8a6bf" font-size="13">3. LittleCursor → Settings → Account</text>
  <rect x="60" y="264" width="40" height="40" rx="10" fill="#d97757"/><text x="80" y="292" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">*</text>
  <text x="116" y="281" fill="#f4f2ff" font-size="15.5" font-weight="700">Use your Claude plan</text>
  <text x="116" y="300" fill="#a8a6bf" font-size="13">Turn it on. Says not installed? Click Check again.</text>
  <rect x="704" y="272" width="52" height="28" rx="14" fill="#8f7cff"/><circle cx="742" cy="286" r="11" fill="#fff"/>
  <text x="410" y="356" fill="#a8a6bf" font-size="13" text-anchor="middle">Needs Claude Pro or Max. The Claude desktop app alone isn't enough; it uses Claude Code.</text>
</svg>
